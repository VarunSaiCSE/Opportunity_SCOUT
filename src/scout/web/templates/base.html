<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOUT Intelligence - Terminal</title>
    
    <!-- Google Fonts: Space Mono and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        background: '#000000',
                        silver: {
                            DEFAULT: '#C0C0C0',
                            dark: '#808080',
                            light: '#E0E0E0'
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #000000;
            color: #C0C0C0;
            /* Old school grid background */
            background-image: 
                linear-gradient(rgba(192, 192, 192, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192, 192, 192, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        /* Strict grid components */
        .strict-border {
            border: 1px solid #C0C0C0;
            background-color: #000000;
        }

        .strict-border-b { border-bottom: 1px solid #C0C0C0; }
        .strict-border-r { border-right: 1px solid #C0C0C0; }
        .strict-border-t { border-top: 1px solid #C0C0C0; }

        /* Japanese grid style card */
        .grid-card {
            border: 1px solid #808080;
            background-color: #000;
            transition: background-color 0s, color 0s;
            cursor: pointer;
        }

        .grid-card:hover {
            background-color: #C0C0C0;
            color: #000000;
        }
        
        .grid-card:hover * {
            color: #000000 !important;
            border-color: #000000 !important;
        }

        .description-reveal {
            display: none;
            border-top: 1px solid #808080;
            padding-top: 1rem;
            margin-top: 1rem;
        }
        
        .description-reveal.open {
            display: block;
        }
    </style>
</head>
<body class="antialiased">
    
    <header class="strict-border-b bg-black sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center h-12">
            <div class="w-12 h-full flex items-center justify-center strict-border-r relative z-20">
                <i data-lucide="radar" class="w-5 h-5 text-silver"></i>
            </div>
            <div class="px-4 h-full flex items-center strict-border-r relative z-20">
                <span class="font-mono font-bold text-silver tracking-widest uppercase">SCOUT</span>
            </div>
            <div class="px-4 h-full flex items-center hidden md:flex text-sm font-mono text-silver-dark relative z-20">
                <span>SYSTEM_STATUS: ONLINE</span>
            </div>
            
            <a href="https://github.com/VarunSaiCSE/Opportunity_SCOUT" target="_blank" class="ml-auto px-4 h-full flex items-center gap-2 hover:bg-silver hover:text-black transition-colors strict-border-l relative z-20 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-silver group-hover:text-black"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.24C15.7 14.5 19 13.9 19 8.5c0-1.5-.5-2.8-1.5-3.8.1-.3.7-1.8-.1-3.8 0 0-1.2-.4-3.9 1.4a12.1 12.1 0 0 0-7 0C3.9 1.1 2.7 1.5 2.7 1.5c-.8 2-.2 3.5-.1 3.8-1 1-1.5 2.3-1.5 3.8 0 5.4 3.3 6 5.4 6.3-.6.6-1 1.5-1 3.2V22"/><path d="M9 19.5c-4.5 1.5-5-2-7-2"/></svg>
                <span class="text-xs font-mono font-bold">VarunSaiCSE</span>
            </a>
        </div>
    </header>

    <div id="grid-blinks" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:1;"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 relative z-10">
        {% block content %}{% endblock %}
    </main>
    
    <style>
        @keyframes blink-anim {
            0% { opacity: 0; box-shadow: 0 0 0px #a855f7; }
            50% { opacity: 0.6; box-shadow: 0 0 10px #a855f7; }
            100% { opacity: 0; box-shadow: 0 0 0px #a855f7; }
        }
    </style>
    <script>
        lucide.createIcons();
        
        // Purple Grid Blinking Effect
        function initGridBlinks() {
            const container = document.getElementById('grid-blinks');
            setInterval(() => {
                const cols = Math.floor(window.innerWidth / 20);
                const rows = Math.floor(window.innerHeight / 20);
                
                const x = Math.floor(Math.random() * cols) * 20;
                const y = Math.floor(Math.random() * rows) * 20;
                
                const blinker = document.createElement('div');
                blinker.style.position = 'absolute';
                blinker.style.left = x + 'px';
                blinker.style.top = y + 'px';
                blinker.style.width = '20px';
                blinker.style.height = '20px';
                blinker.style.backgroundColor = '#a855f7'; // Purple
                blinker.style.opacity = '0';
                blinker.style.animation = 'blink-anim 2s ease-in-out forwards';
                
                container.appendChild(blinker);
                
                // Cleanup
                setTimeout(() => blinker.remove(), 2000);
            }, 300); // A new blink every 300ms
        }
        
        initGridBlinks();
    </script>
</body>
</html>
