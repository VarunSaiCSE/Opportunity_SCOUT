<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOUT Intelligence - Terminal</title>
    
    <!-- Google Fonts: Space Mono and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    colors: {
                        background: '#000000',
                        silver: {
                            DEFAULT: '#C0C0C0',
                            dark: '#808080',
                            light: '#E0E0E0'
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #000000;
            color: #C0C0C0;
            /* Old school grid background */
            background-image: 
                linear-gradient(rgba(192, 192, 192, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(192, 192, 192, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
            box-sizing: border-box;
        }

        /* Strict grid components */
        .strict-border {
            border: 1px solid #C0C0C0;
            background-color: #000000;
        }

        .strict-border-b { border-bottom: 1px solid #C0C0C0; }
        .strict-border-r { border-right: 1px solid #C0C0C0; }
        .strict-border-t { border-top: 1px solid #C0C0C0; }

        /* Japanese grid style card */
        .grid-card {
            border: 1px solid #808080;
            background-color: #000;
            transition: background-color 0s, color 0s;
            cursor: pointer;
        }

        .grid-card:hover {
            background-color: #C0C0C0;
            color: #000000;
        }
        
        .grid-card:hover * {
            color: #000000 !important;
            border-color: #000000 !important;
        }

        .description-reveal {
            display: none;
            border-top: 1px solid #808080;
            padding-top: 1rem;
            margin-top: 1rem;
        }
        
        .description-reveal.open {
            display: block;
        }
    </style>
</head>
<body class="antialiased">
    
    <header class="strict-border-b bg-black sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center h-12">
            <div class="w-12 h-full flex items-center justify-center strict-border-r relative z-20">
                <i data-lucide="radar" class="w-5 h-5 text-silver"></i>
            </div>
            <div class="px-4 h-full flex items-center strict-border-r relative z-20">
                <span class="font-mono font-bold text-silver tracking-widest uppercase">SCOUT</span>
            </div>
            <div class="px-4 h-full flex items-center hidden md:flex text-sm font-mono text-silver-dark relative z-20">
                <span>SYSTEM_STATUS: ONLINE</span>
            </div>
            
            <a href="https://github.com/VarunSaiCSE/Opportunity_SCOUT" target="_blank" class="ml-auto px-4 h-full flex items-center gap-2 hover:bg-silver hover:text-black transition-colors strict-border-l relative z-20 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-silver group-hover:text-black"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.24C15.7 14.5 19 13.9 19 8.5c0-1.5-.5-2.8-1.5-3.8.1-.3.7-1.8-.1-3.8 0 0-1.2-.4-3.9 1.4a12.1 12.1 0 0 0-7 0C3.9 1.1 2.7 1.5 2.7 1.5c-.8 2-.2 3.5-.1 3.8-1 1-1.5 2.3-1.5 3.8 0 5.4 3.3 6 5.4 6.3-.6.6-1 1.5-1 3.2V22"/><path d="M9 19.5c-4.5 1.5-5-2-7-2"/></svg>
                <span class="text-xs font-mono font-bold">VarunSaiCSE</span>
            </a>
        </div>
    </header>

    <div id="grid-blinks" style="position:fixed; top:0; left:0; width:100vw; height:100vh; pointer-events:none; z-index:1;"></div>

    <main class="max-w-6xl mx-auto px-4 py-8 relative z-10 flex-grow min-h-screen">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer Scroll Container (200vh tall to allow sticky scrolling) -->
    <div id="footer-scroll-container" class="relative w-full h-[200vh] mt-20">
        <!-- Sticky Footer -->
        <footer class="sticky top-0 w-full h-screen bg-black overflow-hidden border-t-2 border-silver flex items-center justify-center relative z-10">
            <!-- Parallax Background Text -->
            <div id="parallax-text" class="absolute font-mono font-bold text-[#1a1a1a] select-none text-[10rem] md:text-[18rem] tracking-tighter transition-all duration-75 ease-out" style="z-index: 10;">
                VARUN
            </div>
            
            <!-- Parallax Foreground Image -->
            <div id="parallax-img" class="absolute bottom-0 z-20 flex flex-col items-center transition-opacity duration-75 ease-out">
                <img src="/assets/varun.png" alt="Varun" class="h-[50vh] md:h-[70vh] object-contain filter grayscale contrast-125" onerror="this.src='https://via.placeholder.com/400x500/000000/C0C0C0?text=PLACE+IMAGE+AT+public/assets/varun.png'">
            </div>
            
            <!-- Fade in Social Banner -->
            <div id="social-banner" class="absolute inset-0 z-25 flex flex-col items-center justify-center opacity-0 pointer-events-none transition-opacity duration-75 ease-out" style="padding-bottom: 10vh;">
                <div class="flex flex-wrap justify-center gap-12 md:gap-24">
                    <a href="https://github.com/VarunSaiCSE" target="_blank" class="flex flex-col items-center gap-6 text-silver hover:text-white transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.24C15.7 14.5 19 13.9 19 8.5c0-1.5-.5-2.8-1.5-3.8.1-.3.7-1.8-.1-3.8 0 0-1.2-.4-3.9 1.4a12.1 12.1 0 0 0-7 0C3.9 1.1 2.7 1.5 2.7 1.5c-.8 2-.2 3.5-.1 3.8-1 1-1.5 2.3-1.5 3.8 0 5.4 3.3 6 5.4 6.3-.6.6-1 1.5-1 3.2V22"/><path d="M9 19.5c-4.5 1.5-5-2-7-2"/></svg>
                        <span class="font-mono text-xl md:text-2xl font-bold tracking-widest">GITHUB</span>
                    </a>
                    <a href="https://www.linkedin.com/in/varunsaiandra/" target="_blank" class="flex flex-col items-center gap-6 text-silver hover:text-white transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
                        <span class="font-mono text-xl md:text-2xl font-bold tracking-widest">LINKEDIN</span>
                    </a>
                    <a href="mailto:andra.varunsai@gmail.com" class="flex flex-col items-center gap-6 text-silver hover:text-white transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:scale-110 transition-transform"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <span class="font-mono text-xl md:text-2xl font-bold tracking-widest">EMAIL</span>
                    </a>
                </div>
            </div>
            
            <!-- Footer Content Overlay -->
            <div class="absolute bottom-0 w-full h-48 bg-gradient-to-t from-black via-black/80 to-transparent z-30 pointer-events-none"></div>
            
            <div class="absolute bottom-8 w-full px-8 max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center md:items-end z-40 font-mono text-xs text-silver-dark gap-4 pointer-events-none">
                <div class="text-center md:text-left pointer-events-auto">
                    <p class="text-silver mb-1 font-bold">SCOUT INTELLIGENCE ENGINE v1.0</p>
                    <p>AUTONOMOUS RESEARCH AGENT</p>
                </div>
                
                <div class="flex gap-4 pointer-events-auto hidden md:flex">
                    <a href="mailto:andra.varunsai@gmail.com" class="hover:text-white transition-colors">[ EMAIL ]</a>
                </div>
                
                <div class="text-center md:text-right pointer-events-auto">
                    <p class="text-silver mb-1 font-bold">ARCHITECT: VARUN SAI ANDRA</p>
                    <p>SYSTEM STATUS: OPTIMAL</p>
                </div>
            </div>
        </footer>
    </div>
    
    <style>
        @keyframes blink-anim {
            0% { opacity: 0; box-shadow: 0 0 0px #a855f7; }
            50% { opacity: 0.6; box-shadow: 0 0 10px #a855f7; }
            100% { opacity: 0; box-shadow: 0 0 0px #a855f7; }
        }
    </style>
    <script>
        lucide.createIcons();
        
        // Purple Grid Blinking Effect
        function initGridBlinks() {
            const container = document.getElementById('grid-blinks');
            setInterval(() => {
                const cols = Math.floor(window.innerWidth / 20);
                const rows = Math.floor(window.innerHeight / 20);
                
                const x = Math.floor(Math.random() * cols) * 20;
                const y = Math.floor(Math.random() * rows) * 20;
                
                const blinker = document.createElement('div');
                blinker.style.position = 'absolute';
                blinker.style.left = x + 'px';
                blinker.style.top = y + 'px';
                blinker.style.width = '20px';
                blinker.style.height = '20px';
                blinker.style.backgroundColor = '#a855f7'; // Purple
                blinker.style.opacity = '0';
                blinker.style.animation = 'blink-anim 2s ease-in-out forwards';
                
                container.appendChild(blinker);
                
                // Cleanup
                setTimeout(() => blinker.remove(), 2000);
            }, 300); // A new blink every 300ms
        }
        
        initGridBlinks();
        
        // Parallax & Sticky Scroll Effect for Footer
        window.addEventListener('scroll', () => {
            const container = document.getElementById('footer-scroll-container');
            if (!container) return;
            
            const rect = container.getBoundingClientRect();
            const text = document.getElementById('parallax-text');
            const img = document.getElementById('parallax-img');
            const social = document.getElementById('social-banner');
            
            // Phase 1: Footer sliding into view
            if (rect.top <= window.innerHeight && rect.top > 0) {
                const slideDepth = window.innerHeight - rect.top;
                
                if(text && img) {
                    // Name stays roughly in center (0 offset initially) with slight upward parallax
                    text.style.transform = `translateY(${slideDepth * -0.06}px)`;
                    // Image comes up naturally
                    img.style.transform = `translateY(${slideDepth * -0.02}px)`;
                    
                    img.style.opacity = 1;
                    text.style.opacity = 1;
                    
                    if(social) {
                        social.style.opacity = 0;
                        social.style.pointerEvents = 'none';
                    }
                }
            }
            
            // Phase 2: Footer is stuck to top, scrolling the remaining 100vh container space
            if (rect.top <= 0) {
                const scrollProgress = Math.min(1, Math.max(0, -rect.top / window.innerHeight));
                
                if(text && img && social) {
                    // Keep text and img transforms static at their final Phase 1 positions
                    text.style.transform = `translateY(${window.innerHeight * -0.06}px)`;
                    img.style.transform = `translateY(${window.innerHeight * -0.02}px)`;
                    
                    // Fade out the image rapidly
                    img.style.opacity = Math.max(0, 1 - (scrollProgress * 2.5)); 
                    
                    // Fade out the text with a slight lag
                    text.style.opacity = scrollProgress > 0.15 ? Math.max(0, 1 - ((scrollProgress - 0.15) * 2)) : 1;
                    
                    // Fade in the social banner smoothly
                    social.style.opacity = scrollProgress > 0.4 ? (scrollProgress - 0.4) * 2 : 0;
                    social.style.pointerEvents = scrollProgress > 0.5 ? 'auto' : 'none';
                }
            }
        });
    </script>
</body>
</html>
